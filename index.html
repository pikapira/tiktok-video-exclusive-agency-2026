<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FAUX APERÇU (WhatsApp, Discord, Messenger) -->
  <meta property="og:title" content=" COMO CRIAR AGENCIA TIKTOK " />
  <meta property="og:description" content="assista ate ao fim..." />
  <meta property="og:image" content="miniature.jpg" />
  <meta property="og:type" content="website" />

  <title>Vidéo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    #cover {
      position: fixed; inset: 0; background: #000 url('miniature.jpg') center/cover no-repeat;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10;
    }
    #cover::before {
      content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.35);
    }
    .play-btn {
      position: relative; width: 76px; height: 76px; background: rgba(255,0,0,0.9);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .play-btn::after {
      content: ""; border-style: solid; border-width: 14px 0 14px 24px;
      border-color: transparent transparent transparent #fff; margin-left: 5px;
    }
    video { width: 100%; height: 100%; object-fit: contain; display: none; }
  </style>
</head>
<body>

  <div id="cover" onclick="lancerPrank()">
    <div class="play-btn"></div>
  </div>

  <video id="prank" src="video.mp4" playsinline controls></video>

  <script>
    function lancerPrank() {
      const cover = document.getElementById('cover');
      const v = document.getElementById('prank');
      cover.style.display = 'none';
      v.style.display = 'block';
      v.muted = false;
      v.volume = 1.0;
      v.play();
    }
  </script>

</body>
</html>
